# cargo-deny configuration (v2 schema)
# https://embarkstudios.github.io/cargo-deny/
#
# Run with: cargo deny --workspace --all-features check

[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # paste: unmaintained, but only a compile-time proc-macro pulled in by
    # the gstreamer 0.23 bindings.
    { id = "RUSTSEC-2024-0436", reason = "compile-time proc-macro via gstreamer bindings" },
    # rustls-pemfile: unmaintained thin wrapper over rustls-pki-types, pulled
    # in by rumqttc 0.25 and mailin-embedded.
    { id = "RUSTSEC-2025-0134", reason = "unmaintained notice only; no known vulnerability" },
    # rustls-webpki 0.102.8: rumqttc 0.25.1 depends on it only for its error
    # type (src/tls.rs `WebPki(#[from] webpki::Error)`); certificate
    # verification runs through rustls 0.23 / rustls-webpki 0.103.
    { id = "RUSTSEC-2026-0049", reason = "rustls-webpki 0.102 only used for an error type by rumqttc" },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.102 only used for an error type by rumqttc" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.102 only used for an error type by rumqttc" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.102 only used for an error type by rumqttc" },
    { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.102 only used for an error type by rumqttc" },
]

[licenses]
version = 2
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Mozilla's root certificates, as webpki-roots ships them
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    # foldhash, and nanorand through flume
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
