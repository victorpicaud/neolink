name: Checks

on: [push, pull_request]

# The Rust toolchain (and its clippy/rustfmt components) is pinned by
# rust-toolchain.toml; rustup installs it on first use.

jobs:
  pre_job:
    # continue-on-error: true # Uncomment once integration is finished
    runs-on: ubuntu-latest
    # Map a step output to a job output
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          # All of these options are optional, so you can remove them if you are happy with the defaults
          concurrent_skipping: "same_content_newer"
          skip_after_successful_duplicate: "false"

  check_clippy:
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    name: Clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: apt install gstreamer and deps
        run: |
          sudo apt update
          sudo apt install -y aptitude
          sudo aptitude install -y libgstrtspserver-1.0-dev libgstreamer1.0-dev libgtk2.0-dev protobuf-compiler
      - name: Run clippy
        run: |
          echo "All Features"
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          echo "No Features"
          cargo clippy --workspace --all-targets --no-default-features -- -D warnings
          echo "Gstreamer Only"
          cargo clippy --workspace --all-targets --no-default-features --features=gstreamer -- -D warnings
          echo "Pushnoti Only"
          cargo clippy --workspace --all-targets --no-default-features --features=pushnoti -- -D warnings

  check_fmt:
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    name: Rust-fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustfmt
        run: cargo fmt --all -- --check

  test:
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: apt install gstreamer and deps
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            libgstrtspserver-1.0-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-x \
            protobuf-compiler libssl-dev ffmpeg mosquitto mosquitto-clients
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Test (all features)
        run: cargo test --workspace --all-features
      - name: Test (no default features)
        run: cargo test --workspace --no-default-features
      - name: Test fake camera
        run: cargo test --manifest-path iso-test/sim/fakecam/Cargo.toml
      - name: End-to-end smoke test (neolink rtsp <- fake camera)
        run: bash iso-test/sim/smoke.sh
      - name: End-to-end stuck camera test
        run: bash iso-test/sim/stuck-camera.sh
      - name: End-to-end config reload test (over MQTT)
        run: bash iso-test/sim/config-reload.sh
      - name: End-to-end MQTT burst test
        run: bash iso-test/sim/mqtt-burst.sh

  check_deny:
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny
        run: cargo deny --workspace --all-features check

  check_lua:
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    name: Luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run luacheck
        uses: nebularg/actions-luacheck@v1
        with:
          files: "dissector/baichuan.lua"
          args: --globals Dissector Proto ProtoField base ByteArray DESEGMENT_ONE_MORE_SEGMENT DissectorTable Pref
